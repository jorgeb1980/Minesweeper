plugins {
	id 'java'
	id 'application'
	id 'distribution'
	id("io.freefair.lombok") version "9.8.3"
}

group = 'minesweeper'
version = '1.0.0'

java {
	// Configures Gradle to compile and run using a JDK 25 toolchain
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenLocal()
	mavenCentral()
}

application {
	// Entry point for the './gradlew run' task
	mainClass = 'minesweeper.gui.Main'
}

dependencies {

	implementation 'com.jhlabs:filters:2.0.235-1'
	implementation 'org.apache.sanselan:sanselan:0.97-incubator'
	implementation 'org.slf4j:slf4j-api:1.7.32'
}

// Replace start script
def copyAndReplaceText(source, Closure replaceText){
    source.write(replaceText(source.text))
}

distributions {
	minesweeper {
		distributionBaseName = 'Minesweeper'
		contents {
			from layout.buildDirectory.dir('install/Minesweeper')
		}
	}
}

tasks.register("adapt_resources") {
	doLast {
		copyAndReplaceText(new File('./build/install/Minesweeper/bin/Minesweeper.bat')) {
			def tmp = it
			tmp = tmp.replaceAll("set JAVA_EXE=%JAVA_HOME%/bin/java.exe", "set JAVA_EXE=%JAVA_HOME%/bin/javaw.exe")
			tmp = tmp.replaceAll('"%JAVA_EXE%" %DEFAULT_JVM_OPTS%', 'start %JAVA_EXE% %DEFAULT_JVM_OPTS%')

			return tmp
		}
	}
}

tasks.adapt_resources { dependsOn(installDist) }

tasks.named('minesweeperDistZip', Zip) {
	dependsOn tasks.named('adapt_resources')
	destinationDirectory = layout.buildDirectory.dir('install')
	archiveFileName = 'Minesweeper.zip'
}

tasks.register('executable') { dependsOn('minesweeperDistZip') }

